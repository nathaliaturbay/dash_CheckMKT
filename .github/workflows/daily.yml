name: Update dashboards

on:
  schedule:
    - cron: '0 11 * * *'   # 8h Brasília, every day
    - cron: '0 17 * * *'   # 14h Brasília, every day
  workflow_dispatch:       # "Run workflow" button for an update on demand
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build pages from the Stract sheets
        run: node build.js
        env:
          AJ_META_CSV: ${{ secrets.AJ_META_CSV || vars.AJ_META_CSV }}
          AJ_GOOGLE_CSV: ${{ secrets.AJ_GOOGLE_CSV || vars.AJ_GOOGLE_CSV }}
          SHORELINE_META_CSV: ${{ secrets.SHORELINE_META_CSV || vars.SHORELINE_META_CSV }}
          ONME_META_CSV: ${{ secrets.ONME_META_CSV || vars.ONME_META_CSV }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
